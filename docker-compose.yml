# =============================================================================
# Bonaire Patacona — full self-hosted stack
#
#   app      Nuxt 4 (landing + booking engine + /admin)
#   kong     Supabase API gateway  -> the only Supabase port you expose
#   db       Postgres 15 (supabase/postgres)
#   auth     GoTrue (admin login)
#   rest     PostgREST
#   storage  Storage API + imgproxy (gallery uploads)
#   meta     postgres-meta (needed by Studio)
#   studio   Supabase Studio (optional, keep it behind auth or off in prod)
#   migrator one-shot job that applies supabase/db/init/*.sql idempotently
#
# Deploy on Dokploy / Dockhand / Coolify as a "Docker Compose" application, or
# run it directly with `docker compose up -d`. Copy .env.example to .env first
# and generate the keys with `node scripts/generate-supabase-keys.mjs`.
# =============================================================================

name: bonaire

x-db-env: &db-env
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-postgres}
  POSTGRES_USER: supabase_admin
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

services:
  # ---------------------------------------------------------------------------
  # Nuxt application
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SUPABASE_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:8000}
        SUPABASE_KEY: ${ANON_KEY:?ANON_KEY is required}
    restart: unless-stopped
    depends_on:
      migrator:
        condition: service_completed_successfully
    environment:
      NUXT_PUBLIC_SITE_URL: ${SITE_URL:?SITE_URL is required}
      NUXT_PUBLIC_SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
      NUXT_PUBLIC_SUPABASE_KEY: ${ANON_KEY}
      # Server-to-server calls stay inside the compose network.
      NUXT_SUPABASE_INTERNAL_URL: http://kong:8000
      NUXT_SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY:?SERVICE_ROLE_KEY is required}
      NUXT_STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      NUXT_STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      NUXT_ICAL_SYNC_ENABLED: ${ICAL_SYNC_ENABLED:-true}
      NUXT_CRON_SECRET: ${CRON_SECRET:-}
      TZ: ${TZ:-Europe/Madrid}
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Database
  # ---------------------------------------------------------------------------
  db:
    image: supabase/postgres:15.8.1.060
    restart: unless-stopped
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    environment:
      <<: *db-env
      # The image's own init runs before Postgres listens on TCP, so it has to
      # reach the server over the Unix socket. Leaving the `db` hostname from
      # x-db-env here makes that step fail and the cluster comes up without the
      # supabase_auth_admin / authenticator / … roles, which then breaks auth,
      # rest and storage. Every other service keeps using the `db` hostname.
      POSTGRES_HOST: /var/run/postgresql
      PGDATA: /var/lib/postgresql/data
      POSTGRES_INITDB_ARGS: "--data-checksums"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXP: ${JWT_EXPIRY:-3600}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supabase_admin -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published on purpose. Uncomment only if you need external psql access.
    # ports:
    #   - "${POSTGRES_PORT:-5432}:5432"

  # ---------------------------------------------------------------------------
  # Schema migrations (one-shot, idempotent, re-runs on every deploy)
  # ---------------------------------------------------------------------------
  migrator:
    image: postgres:15-alpine
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: supabase_admin
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-postgres}
      # First back-office account. Left empty -> no account is created.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PASSWORD_RESET: ${ADMIN_PASSWORD_RESET:-false}
    volumes:
      - ./supabase/db/init:/sql:ro
      - ./supabase/db/migrate.sh:/migrate.sh:ro
      - ./supabase/db/roles.sql:/roles.sql:ro
      - ./supabase/db/bootstrap-admin.sql:/bootstrap-admin.sql:ro
    entrypoint: ["/bin/sh", "/migrate.sh"]

  # ---------------------------------------------------------------------------
  # Auth (GoTrue)
  # ---------------------------------------------------------------------------
  auth:
    image: supabase/gotrue:v2.177.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: ${SUPABASE_PUBLIC_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:-}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      # Back-office accounts are created by the owner, never self-served.
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-true}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: ${MAILER_AUTOCONFIRM:-false}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-Bonaire Patacona}
      GOTRUE_MAILER_URLPATHS_RECOVERY: /admin/reset-password
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /admin/confirm
      GOTRUE_MAILER_URLPATHS_INVITE: /admin/confirm
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_SMS_AUTOCONFIRM: "true"

  # ---------------------------------------------------------------------------
  # PostgREST
  # ---------------------------------------------------------------------------
  rest:
    image: postgrest/postgrest:v12.2.12
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public,storage,graphql_public}
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-3600}
    command: ["postgrest"]

  # ---------------------------------------------------------------------------
  # Storage
  # ---------------------------------------------------------------------------
  storage:
    image: supabase/storage-api:v1.25.7
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
      imgproxy:
        condition: service_started
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      FILE_SIZE_LIMIT: "52428800"
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: http://imgproxy:5001
    volumes:
      - storage-data:/var/lib/storage

  imgproxy:
    image: darthsim/imgproxy:v3.8.0
    restart: unless-stopped
    environment:
      IMGPROXY_BIND: ":5001"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_ENABLE_WEBP_DETECTION: "true"
    volumes:
      - storage-data:/var/lib/storage

  # ---------------------------------------------------------------------------
  # Studio (optional dashboard)
  # ---------------------------------------------------------------------------
  meta:
    image: supabase/postgres-meta:v0.91.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: "8080"
      PG_META_DB_HOST: db
      PG_META_DB_PORT: "5432"
      PG_META_DB_NAME: ${POSTGRES_DB:-postgres}
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}

  studio:
    image: supabase/studio:2025.06.30-sha-6f5982d
    restart: unless-stopped
    profiles: ["studio"]
    depends_on:
      meta:
        condition: service_started
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DEFAULT_ORGANIZATION_NAME: ${STUDIO_DEFAULT_ORGANIZATION:-Bonaire}
      DEFAULT_PROJECT_NAME: ${STUDIO_DEFAULT_PROJECT:-Bonaire Patacona}
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      NEXT_PUBLIC_ENABLE_LOGS: "false"
      NEXT_ANALYTICS_BACKEND_PROVIDER: postgres

  # ---------------------------------------------------------------------------
  # API gateway — the single public entry point for Supabase
  # ---------------------------------------------------------------------------
  kong:
    image: kong:2.8.1
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_started
      rest:
        condition: service_started
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-supabase}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?DASHBOARD_PASSWORD is required}
    volumes:
      - ./supabase/kong/kong.template.yml:/home/kong/temp.yml:ro
    entrypoint: >
      bash -c 'eval "echo \"$$(cat ~/temp.yml)\"" > ~/kong.yml && /docker-entrypoint.sh kong docker-start'
    ports:
      - "${KONG_HTTP_PORT:-8000}:8000/tcp"

volumes:
  db-data:
  storage-data:
